services:
  - type: web
    name: eventpass
    runtime: python
    buildCommand: |
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate
    startCommand: gunicorn eventpass.wsgi:application --workers 2 --timeout 120 --log-level info
    envVars:
      - key: SECRET_KEY
        generateValue: true          # Render generates a secure random value
      - key: DEBUG
        value: "False"
      - key: SECURE_SSL_REDIRECT
        value: "False"               # Render's edge handles HTTP→HTTPS, avoid loop
      - key: DATABASE_URL
        fromDatabase:
          name: eventpass-db
          property: connectionString
    autoDeploy: false                # Deploy manually; set to true for auto on git push

databases:
  - name: eventpass-db
    databaseName: eventpass_db
    user: eventpass_user
    plan: free
